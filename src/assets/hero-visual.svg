  </g>
  <circle cx="300" cy="180" r="3" fill="#82f4a1" opacity="0.6"/>
  <circle cx="240" cy="300" r="3" fill="#82f4a1" opacity="0.6"/>
  <circle cx="360" cy="300" r="3" fill="#82f4a1" opacity="0.6"/>
  <circle cx="300" cy="420" r="3" fill="#82f4a1" opacity="0.6"/>
  <circle cx="300" cy="240" r="2" fill="#82f4a1" opacity="0.4"/>
  <circle cx="300" cy="360" r="2" fill="#82f4a1" opacity="0.4"/>
