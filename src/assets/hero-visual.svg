    <line x1="240" y1="300" x2="300" y2="420" stroke="#82f4a1" stroke-width="1.5"/>
    <line x1="360" y1="300" x2="300" y2="420" stroke="#82f4a1" stroke-width="1.5"/>
    <line x1="240" y1="300" x2="300" y2="240" stroke="#82f4a1" stroke-width="1"/>
    <line x1="360" y1="300" x2="300" y2="240" stroke="#82f4a1" stroke-width="1"/>
