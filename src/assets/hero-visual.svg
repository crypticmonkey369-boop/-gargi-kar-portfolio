    <filter id="blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <circle cx="300" cy="300" r="250" fill="url(#glow)"/>
  <circle cx="300" cy="300" r="120" fill="none" stroke="#82f4a1" stroke-width="0.5" opacity="0.3"/>
  <circle cx="300" cy="300" r="80" fill="#82f4a1" fill-opacity="0.06" stroke="#82f4a1" stroke-width="1" opacity="0.4"/>
